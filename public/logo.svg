<svg viewBox="0 0 500 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="1" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Left Cap -->
  <g transform="translate(10, 5)">
      <path d="M 30 40 L 70 25 L 110 40 L 70 55 Z" fill="#2C2C2C"/>
      <rect x="65" y="45" width="10" height="20" fill="#2C2C2C"/>
      <circle cx="70" cy="40" r="4" fill="#BF953F"/>
      <path d="M 74 40 Q 80 60 70 65" stroke="#BF953F" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Text: Centered -->
  <text x="250" y="55" font-family="Arial, sans-serif" font-weight="900" font-size="40" text-anchor="middle" fill="#BF953F" filter="url(#textShadow)" letter-spacing="1">CAREER RESOURCES</text>

  <!-- Right Cap -->
  <g transform="translate(360, 5)">
      <path d="M 30 40 L 70 25 L 110 40 L 70 55 Z" fill="#2C2C2C"/>
      <rect x="65" y="45" width="10" height="20" fill="#2C2C2C"/>
      <circle cx="70" cy="40" r="4" fill="#BF953F"/>
      <path d="M 74 40 Q 80 60 70 65" stroke="#BF953F" stroke-width="2" fill="none"/>
  </g>
</svg>